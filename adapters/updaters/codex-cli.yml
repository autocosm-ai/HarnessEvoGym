apiVersion: harness-rsi/v1alpha1
kind: UpdaterAdapter

metadata:
  id: codex-cli
  name: Codex CLI Updater

spec:
  protocol: codex-exec-v1

  # Updater 属于冻结基础设施，不从 Candidate 或用户级 Codex 配置加载任何内容。
  # 这里固定本机官方 npm distribution；执行时会再次核验包名、版本和路径归属。
  runtime:
    executable: "${RSI_CODEX_DISTRIBUTION_ROOT}/bin/codex.js"
    distributionRoot: "${RSI_CODEX_DISTRIBUTION_ROOT}"
    nodeBinary: "${RSI_NODE_BINARY}"
    bwrapPath: "${RSI_BWRAP_PATH}"
    setprivPath: "${RSI_SETPRIV_PATH}"
    package: "@openai/codex"
    version: 0.153.4
    distributionDigest: bdc3d5259b37555217ea371c8d3a60a4560a5fe7f08ab061ba60101baa7acf6e
    providerId: zcloud
    maximumModelRequests: 64
    secretEnvironment:
      - RSI_PROVIDER_API_KEY
      - RSI_PROVIDER_BASE_URL

  prompt:
    path: prompts/updater.md

  output:
    candidate: filesystem-diff
    mutationReport:
      kind: controller-artifact
      name: mutation-report.json
