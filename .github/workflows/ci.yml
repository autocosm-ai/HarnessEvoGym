name: Harness EvoGym CI

on:
  push:
    branches: ["lz-dev", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Check source syntax and scripts
        run: npm run check

      - name: Run Controller and Server offline tests
        run: npm test

      - name: Run standalone evaluator offline tests
        run: npm run test:eval
