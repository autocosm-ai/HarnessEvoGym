apiVersion: harness-rsi/v1alpha1
kind: EvolutionRecipe
spec:
  population:
    mode: mutualism
    concurrency: { n_branches: 2 }
    budget: { total_budget: 2, beta: 0 }
    peer_sharing: { enabled: true }
    competition: { enabled: false }
  moduleSearch:
    authority: strategy-directed
    riskCeiling: l3
    strategy: linear-hill-climb
    excludeRegions: [model-transport, runtime-wiring]
