apiVersion: harness-rsi/v1alpha1
kind: EvolutionRecipe
spec:
  population:
    mode: single
    concurrency: { n_branches: 1 }
    budget: { total_budget: 2, beta: 0.5 }
    peer_sharing: { enabled: false }
    competition: { enabled: false }
  moduleSearch:
    authority: strategy-directed
    riskCeiling: l1
    strategy: linear-hill-climb
  checkpointing:
    budgetMilestones: [1, 2]
    branchGenerationMilestones: []
    capture:
      populationBest: true
      branchIncumbents: true
      latestAttempts: true
